name: 更新红果榜单

on:
  schedule:
    - cron: '7 3,6,10 * * *'
  workflow_dispatch:
    inputs:
      refresh_today:
        description: '重新从官网采集今天的批次'
        type: boolean
        default: false

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: 从红果采集和计算榜单
        env:
          REFRESH_TODAY: ${{ inputs.refresh_today }}
        run: |
          if [[ "$REFRESH_TODAY" == true ]]; then
            python3 radar.py --refresh-today
          else
            python3 radar.py
          fi
      - name: 保存每日快照
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m '更新红果榜单快照'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
